<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Quantum Node</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.4);
            animation: pulse 4s infinite ease-in-out;
        }

        .logo svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        .login-form {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(12px);
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.7);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .credentials-help {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .credentials-help summary {
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .credentials-help summary:hover {
            color: #cbd5e1;
        }

        .credentials-list {
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }

        .credential-item {
            margin-bottom: 8px;
        }

        .credential-user {
            color: #3b82f6;
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
                filter: brightness(1.2);
            }
        }

        @media (max-width: 480px) {
            .login-form {
                width: 280px;
                padding: 25px;
            }
            
            .logo {
                width: 100px;
                height: 100px;
            }
            
            .logo svg {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Logo Only -->
        <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" />
                <path d="M2 17L12 22L22 17" />
                <path d="M2 12L12 17L22 12" />
            </svg>
        </div>

        <!-- Login Form -->
        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">USUARIO</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="submit-btn">
                    ACCEDER AL SISTEMA
                </button>
            </form>
            
            <div class="credentials-help">
                <details>
                    <summary>CREDENCIALES DE ACCESO</summary>
                    <div class="credentials-list">
                        <div class="credential-item">
                            <span class="credential-user">admin</span> / admin123
                        </div>
                        <div class="credential-item">
                            <span class="credential-user">user</span> / user123
                        </div>
                        <div class="credential-item">
                            <span class="credential-user">ceo</span> / ceo123456
                        </div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const button = e.target.querySelector('.submit-btn');
            
            if (!username || !password) {
                alert('Por favor completa ambos campos');
                return;
            }
            
            // Store credentials in sessionStorage
            sessionStorage.setItem('auth_token', 'nexus_quantum_' + Date.now());
            sessionStorage.setItem('operator_id', username.toUpperCase());
            sessionStorage.setItem('login_time', new Date().toISOString());
            
            button.textContent = 'ACCEDIENDO...';
            button.disabled = true;
            
            // Simulate login process
            setTimeout(() => {
                window.location.href = '../DASHBOARD/quantum-qr-payment.html';
            }, 1500);
        });
        
        // Auto-focus on username field
        document.getElementById('username').focus();
    </script>
</body>
</html>
