<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Acceso de Operador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-dark {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .input-dark:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .glow-button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        .animate-float {
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    transparent 25%,
                    rgba(255, 255, 255, 0.05) 50%,
                    transparent 75%);
            animation: shimmer 4s infinite linear;
        }

        @keyframes shimmer {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="absolute inset-0 z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[100px] animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[100px] animate-pulse"
            style="animation-delay: 1s;"></div>
    </div>

    <div class="relative z-10 w-full max-w-md px-6">
        <div class="glass-panel p-10 rounded-3xl shimmer">
            <div class="flex flex-col items-center mb-10">
                <div
                    class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30 animate-float">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-white tracking-widest uppercase">NEXUS NODE</h1>
                <p class="text-slate-400 mt-2 text-sm tracking-widest font-light">OPERATOR CONSOLE V3.1</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">ID de
                        Operador</label>
                    <input type="text" id="operatorId" required
                        class="input-dark w-full px-5 py-4 rounded-xl text-lg font-medium"
                        placeholder="NEXUS-XXXX-XXXX">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Clave de
                        Acceso</label>
                    <input type="password" id="accessKey" required
                        class="input-dark w-full px-5 py-4 rounded-xl text-lg font-medium" placeholder="••••••••••••">
                </div>

                <div class="pt-4">
                    <button type="submit"
                        class="glow-button w-full py-5 rounded-2xl text-white font-bold text-lg tracking-widest uppercase transition-all duration-300 transform active:scale-95">
                        Iniciar Nodo
                    </button>
                </div>
            </form>

            <div class="mt-10 pt-6 border-t border-white/5 text-center">
                <p class="text-slate-500 text-xs tracking-widest font-medium uppercase mb-4">Estado del Sistema</p>
                <div class="flex items-center justify-center gap-4">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-ping"></div>
                        <span class="text-green-500 text-[10px] font-bold tracking-tighter">CLOUD ACTIVE</span>
                    </div>
                    <div class="w-px h-3 bg-white/10"></div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                        <span class="text-blue-500 text-[10px] font-bold tracking-tighter">SSL SECURE</span>
                    </div>
                </div>
            </div>
        </div>

        <p class="text-center text-slate-600 text-[10px] mt-8 tracking-[0.3em] font-medium uppercase">
            Designed by Google Deepmind | Nexus Core v3.1.0-PRO
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const operatorId = document.getElementById('operatorId').value;
            const accessKey = document.getElementById('accessKey').value;

            // Simulación de autenticación (en producción validar con API)
            if (operatorId && accessKey) {
                sessionStorage.setItem('auth_token', 'nexus_session_' + Date.now());
                sessionStorage.setItem('operator_id', operatorId);

                // Efecto de carga
                const btn = e.target.querySelector('button');
                btn.innerHTML = '<span class="animate-spin inline-block mr-2">◌</span> Conectando...';
                btn.classList.add('opacity-80', 'cursor-not-allowed');

                setTimeout(() => {
                    window.location.href = '../DASHBOARD/DASHBOARD-INTEGRATED.html';
                }, 1500);
            }
        });
    </script>
</body>

</html>
